<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P1 Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    #status { font-size: 14px; margin-bottom: 24px; }
    .ok { color: #1a7f37; }
    .error { color: #cf222e; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; }
    small { color: #888; display: block; }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <div id="status">Đang kiểm tra kết nối...</div>

  <form id="form">
    <input id="text" placeholder="Nhập tin nhắn..." maxlength="255" required>
    <button type="submit">Gửi</button>
  </form>

  <ul id="list"></ul>

  <script>
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('text');

    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        statusEl.textContent = res.ok ? 'Client → Server → MySQL: đã kết nối' : 'Lỗi: ' + data.db;
        statusEl.className = res.ok ? 'ok' : 'error';
      } catch {
        statusEl.textContent = 'Không gọi được server';
        statusEl.className = 'error';
      }
    }

    async function loadMessages() {
      const res = await fetch('/api/messages');
      const messages = await res.json();
      listEl.innerHTML = '';
      for (const m of messages) {
        const li = document.createElement('li');
        li.textContent = m.text;
        const time = document.createElement('small');
        time.textContent = new Date(m.created_at).toLocaleString('vi-VN');
        li.appendChild(time);
        listEl.appendChild(li);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input.value }),
      });
      input.value = '';
      loadMessages();
    });

    checkHealth();
    loadMessages();
  </script>
</body>
</html>
